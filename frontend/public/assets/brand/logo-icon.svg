<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="50%" stop-color="#070c16"/>
      <stop offset="100%" stop-color="#03060a"/>
    </linearGradient>

    <!-- Glowing Cyan/Teal Brand Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ffcd4"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Accent Violet/Blue Gradient -->
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shield Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ffcd4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base with Cyber Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Ambient Glow Behind Symbol -->
  <circle cx="256" cy="240" r="140" fill="#2ffcd4" opacity="0.12" filter="url(#neonGlow)"/>

  <!-- Circuit Trace Accents -->
  <path d="M120 180 L160 180 L190 210" stroke="#2ffcd4" stroke-width="2.5" stroke-opacity="0.4" stroke-linecap="round"/>
  <circle cx="120" cy="180" r="4" fill="#2ffcd4" opacity="0.6"/>
  
  <path d="M392 332 L352 332 L322 302" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.4" stroke-linecap="round"/>
  <circle cx="392" cy="332" r="4" fill="#38bdf8" opacity="0.6"/>

  <!-- Main TG Stylized Quantum Aircraft / Lightning Hybrid -->
  <g filter="url(#neonGlow)">
    <!-- Back Wing Shading -->
    <path d="M128 248 L384 136 L240 376 Z" fill="url(#violetGrad)" opacity="0.35"/>
    
    <!-- Main Swept Wing -->
    <path d="M128 248 L384 136 L288 276 L216 332 Z" fill="url(#cyanGrad)"/>
    
    <!-- Dynamic Lightning Energy Fold -->
    <path d="M384 136 L232 268 L288 276 L196 376 L236 296 L176 304 Z" fill="#ffffff" opacity="0.95"/>

    <!-- Speed Streamlines -->
    <path d="M152 284 L104 316" stroke="#2ffcd4" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M184 324 L148 348" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Quantum Core Sparkle Node -->
  <circle cx="384" cy="136" r="7" fill="#ffffff"/>
  <circle cx="384" cy="136" r="14" fill="#2ffcd4" opacity="0.6" filter="url(#neonGlow)"/>
</svg>
