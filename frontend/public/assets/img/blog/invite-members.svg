<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Dark gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020406"/>
      <stop offset="50%" stop-color="#06090e"/>
      <stop offset="100%" stop-color="#040608"/>
    </linearGradient>

    <!-- Accent glow -->
    <radialGradient id="glow" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Left Content Container -->
  <g transform="translate(80, 0)">
    <!-- Brand badge -->
    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="220" height="34" rx="8" fill="rgba(47, 252, 212, 0.08)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="16" cy="17" r="4" fill="#10b981"/>
      <text x="28" y="22" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11" letter-spacing="1.5">GROWTH &amp; INVITES</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="240" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="-1">
      Invite 10,000+ Members Fast
    </text>

    <!-- Subtitle / Feature Points -->
    <text x="0" y="295" fill="rgba(255, 255, 255, 0.65)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      Invite via Admin • FloodWait Balancing • Live Channel Growth
    </text>

    <!-- Feature metrics bar -->
    <g transform="translate(0, 420)">
      <rect x="0" y="0" width="580" height="85" rx="14" fill="#080d12" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

      <!-- Metric 1 -->
      <g transform="translate(30, 22)">
        <text x="0" y="16" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20">100%</text>
        <text x="0" y="38" fill="rgba(255, 255, 255, 0.45)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="12">MTProto Native</text>
      </g>

      <!-- Metric 2 -->
      <g transform="translate(210, 22)">
        <text x="0" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20">Zero-Ban</text>
        <text x="0" y="38" fill="rgba(255, 255, 255, 0.45)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="12">Smart Warmup</text>
      </g>

      <!-- Metric 3 -->
      <g transform="translate(390, 22)">
        <text x="0" y="16" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20">77+ Modules</text>
        <text x="0" y="38" fill="rgba(255, 255, 255, 0.45)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="12">Windows Pro</text>
      </g>
    </g>

    <!-- Platform Footer watermark -->
    <g transform="translate(0, 570)">
      <circle cx="10" cy="10" r="10" fill="#10b981"/>
      <path d="M6 10 L9 13 L14 7" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="30" y="15" fill="rgba(255, 255, 255, 0.5)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" letter-spacing="1">TELEGRAM GEEKS PRO • OFFICIAL GUIDE</text>
    </g>
  </g>

  <!-- Right Graphic Illustration -->
  
        <g transform="translate(780, 130)">
          <circle cx="180" cy="170" r="140" fill="#10b981" fill-opacity="0.06" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
          <!-- Center Channel -->
          <circle cx="180" cy="170" r="55" fill="#0f172a" stroke="#10b981" stroke-width="3"/>
          <text x="180" y="165" fill="#10b981" font-family="sans-serif" font-weight="900" font-size="18" text-anchor="middle">+10k</text>
          <text x="180" y="185" fill="white" fill-opacity="0.7" font-family="sans-serif" font-size="10" text-anchor="middle">MEMBERS</text>
          <!-- Users joining -->
          <circle cx="80" cy="100" r="22" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
          <circle cx="280" cy="90" r="22" fill="#1e293b" stroke="#059669" stroke-width="2"/>
          <circle cx="70" cy="240" r="22" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
          <circle cx="290" cy="230" r="22" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
          <!-- Incoming arrows -->
          <path d="M105 115 L140 145 M130 135 L140 145 L130 152" stroke="#10b981" stroke-width="2"/>
          <path d="M255 105 L220 140 M230 130 L220 140 L230 147" stroke="#10b981" stroke-width="2"/>
          <path d="M95 225 L135 190 M125 185 L135 190 L125 200" stroke="#10b981" stroke-width="2"/>
          <path d="M265 215 L225 190 M235 185 L225 190 L235 200" stroke="#10b981" stroke-width="2"/>
        </g>
      
</svg>