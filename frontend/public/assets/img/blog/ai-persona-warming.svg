<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Dark gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020406"/>
      <stop offset="50%" stop-color="#06090e"/>
      <stop offset="100%" stop-color="#040608"/>
    </linearGradient>

    <!-- Accent glow -->
    <radialGradient id="glow" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2ffcd4" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Left Content Container -->
  <g transform="translate(80, 0)">
    <!-- Brand badge -->
    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="220" height="34" rx="8" fill="rgba(47, 252, 212, 0.08)" stroke="#2ffcd4" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="16" cy="17" r="4" fill="#2ffcd4"/>
      <text x="28" y="22" fill="#2ffcd4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11" letter-spacing="1.5">AI NEURO-TEXT</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="240" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="-1">
      AI Persona Warming Engine
    </text>

    <!-- Subtitle / Feature Points -->
    <text x="0" y="295" fill="rgba(255, 255, 255, 0.65)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      Peer-to-Peer Dialogues • Human Typing Cadence • Trust Scores
    </text>

    <!-- Feature metrics bar -->
    <g transform="translate(0, 420)">
      <rect x="0" y="0" width="580" height="85" rx="14" fill="#080d12" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

      <!-- Metric 1 -->
      <g transform="translate(30, 22)">
        <text x="0" y="16" fill="#2ffcd4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20">100%</text>
        <text x="0" y="38" fill="rgba(255, 255, 255, 0.45)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="12">MTProto Native</text>
      </g>

      <!-- Metric 2 -->
      <g transform="translate(210, 22)">
        <text x="0" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20">Zero-Ban</text>
        <text x="0" y="38" fill="rgba(255, 255, 255, 0.45)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="12">Smart Warmup</text>
      </g>

      <!-- Metric 3 -->
      <g transform="translate(390, 22)">
        <text x="0" y="16" fill="#2ffcd4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20">77+ Modules</text>
        <text x="0" y="38" fill="rgba(255, 255, 255, 0.45)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="12">Windows Pro</text>
      </g>
    </g>

    <!-- Platform Footer watermark -->
    <g transform="translate(0, 570)">
      <circle cx="10" cy="10" r="10" fill="#2ffcd4"/>
      <path d="M6 10 L9 13 L14 7" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="30" y="15" fill="rgba(255, 255, 255, 0.5)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" letter-spacing="1">TELEGRAM GEEKS PRO • OFFICIAL GUIDE</text>
    </g>
  </g>

  <!-- Right Graphic Illustration -->
  
        <g transform="translate(770, 130)">
          <!-- AI Brain Network -->
          <circle cx="180" cy="170" r="120" fill="#2ffcd4" fill-opacity="0.05" stroke="#2ffcd4" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 4"/>
          <circle cx="180" cy="170" r="70" fill="#8b5cf6" fill-opacity="0.15" stroke="#2ffcd4" stroke-width="2"/>
          <path d="M150 150 Q180 120 210 150 Q180 200 150 150 Z" fill="#2ffcd4" fill-opacity="0.3" stroke="#2ffcd4" stroke-width="2"/>
          <!-- Neural nodes -->
          <circle cx="90" cy="120" r="14" fill="#0f172a" stroke="#2ffcd4" stroke-width="2"/>
          <circle cx="270" cy="110" r="16" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"/>
          <circle cx="100" cy="230" r="18" fill="#0f172a" stroke="#2ffcd4" stroke-width="2"/>
          <circle cx="260" cy="220" r="15" fill="#0f172a" stroke="#2ffcd4" stroke-width="2"/>
          <!-- Synapses -->
          <line x1="180" y1="170" x2="90" y2="120" stroke="#2ffcd4" stroke-width="1.5"/>
          <line x1="180" y1="170" x2="270" y2="110" stroke="#2ffcd4" stroke-width="1.5"/>
          <line x1="180" y1="170" x2="100" y2="230" stroke="#2ffcd4" stroke-width="1.5"/>
          <line x1="180" y1="170" x2="260" y2="220" stroke="#2ffcd4" stroke-width="1.5"/>
          <!-- Chat bubbles -->
          <rect x="230" y="40" width="130" height="40" rx="8" fill="#1e293b" stroke="#2ffcd4" stroke-width="1.5"/>
          <text x="245" y="65" fill="#2ffcd4" font-family="sans-serif" font-weight="bold" font-size="11">Human Cadence</text>
        </g>
      
</svg>