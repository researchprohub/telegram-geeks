# TelegramGeeks — Docker Compose

services:
  # ─── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: telegramgeeks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Ollama (local AI models) ─────────────────────────────
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'cat < /dev/null > /dev/tcp/localhost/11434' && echo OK || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Backend (FastAPI) ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/telegramgeeks
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_API_ID: "${TELEGRAM_API_ID:-12345678}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH:-your_api_hash}"
      # JWT — generate with: python -c "import secrets; print(secrets.token_hex(32))"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required (min 32 chars)}"
      DEFAULT_AI_PROVIDER: "${DEFAULT_AI_PROVIDER:-ollama}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      OLLAMA_BASE_URL: http://ollama:11434
      # Cookie & CORS settings for production
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: "lax"
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:8000","http://localhost:80"]'
      FRONTEND_URL: "http://localhost:3000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./telegram_layer:/app/telegram_layer
      - ./sessions:/app/sessions
      - ./data:/app/data
      - ./contacts:/app/contacts

  # ─── Frontend (Next.js) ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

  # ─── Nginx Reverse Proxy ───────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      NGINX_SERVER_NAME: "${NGINX_SERVER_NAME:-localhost}"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    command: >
      sh -c "mkdir -p /etc/nginx/certs &&
      openssl req -x509 -nodes -days 365 -newkey rsa:2048
        -keyout /etc/nginx/certs/key.pem -out /etc/nginx/certs/cert.pem
        -subj '/CN=$${NGINX_SERVER_NAME}' 2>/dev/null &&
      nginx -g 'daemon off;'"

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  nginx_certs:
