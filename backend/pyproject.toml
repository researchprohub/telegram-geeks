[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-engagement-platform-backend"
version = "1.0.0"
description = "Backend API for the Telegram Engagement Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "telethon>=1.36.0",
    "aiogram>=3.0.0",
    "aiohttp>=3.9.0",
    "pysocks>=1.7.1",
    "redis[hiredis]>=5.0.0",
    "openai>=1.30.0",
    "anthropic>=0.25.0",
    "groq>=0.5.0",
    "ollama>=0.2.0",
    "cryptography>=42.0.0",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "pytz>=2024.1",
    "httpx>=0.27.0",
    "qrcode[pil]>=7.4.2",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
