[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-engagement-platform-database-layer"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "redis[hiredis]>=5.0.0",
    "pydantic>=2.0.0",
    "alembic>=1.13.0",
    "loguru>=0.7.0",
    "cryptography>=42.0.0",
]
