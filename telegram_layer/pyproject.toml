[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-engagement-platform-telegram-layer"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.36.0",
    "aiogram>=3.0.0",
    "aiohttp>=3.9.0",
    "redis[hiredis]>=5.0.0",
    "pydantic>=2.0.0",
    "loguru>=0.7.0",
    "cryptography>=42.0.0",
]
